spring:
  application:
    name: flowpanel
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/flowpanel}
    username: ${DATABASE_USERNAME:flowpanel}
    password: ${DATABASE_PASSWORD:flowpanel}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
  default-produces-media-type: application/json

flowpanel:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
    ttl: 8h
    cookie-name: fp_session
    secure-cookie: false
  demo:
    seed-on-startup: true
  ai:
    profile: ${AI_PROFILE:mock}
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    daily-budget-usd: ${AI_DAILY_BUDGET_USD:2}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:30}
    default-max-tokens: 800
    confidence-threshold: 0.75
    # USD per 1M tokens (OpenAI pricing page, checked 2026-10-01). Used for estimated cost per call.
    pricing:
      "[gpt-4o-mini]": { input-per-million: 0.15, output-per-million: 0.60 }
      "[gpt-4.1-nano]": { input-per-million: 0.10, output-per-million: 0.40 }
      "[gpt-5-nano]": { input-per-million: 0.05, output-per-million: 0.40 }
      "[gpt-5-mini]": { input-per-million: 0.25, output-per-million: 2.00 }
      "[text-embedding-3-small]": { input-per-million: 0.02, output-per-million: 0 }
