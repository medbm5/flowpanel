# Render blueprint: the backend (Docker, free plan). The database is Neon (PostgreSQL 16 + pgvector, free tier).
# One click: https://render.com/deploy?repo=https://github.com/medbm5/flowpanel
# Secrets are generated by Render or entered in the dashboard, never committed.
services:
  - type: web
    name: flowpanel-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: false # later deploys are triggered by .github/workflows/deploy.yml after CI passes
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon connection string as shown in the Neon console, e.g.
      # postgresql://user:password@ep-xxx-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require
      # (converted to JDBC by DatabaseUrlEnvironmentPostProcessor; a jdbc: URL also works).
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: AI_PROFILE # mock (no key needed) or live
        value: mock
      - key: OPENAI_API_KEY # only for AI_PROFILE=live
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: AI_DAILY_BUDGET_USD
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS # the Vercel URL, e.g. https://flowpanel.vercel.app
        sync: false
