name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvnw verify, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/flowpanel-backend.jar
          retention-days: 3

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  evals:
    name: Eval suite (mock profile, CI gate)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: flowpanel
          POSTGRES_USER: flowpanel
          POSTGRES_PASSWORD: flowpanel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowpanel" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r evals/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Run evals
        env:
          EVAL_DATABASE_URL: jdbc:postgresql://localhost:5432/flowpanel
        run: |
          touch backend/target/flowpanel-backend.jar
          bash evals/run_mock.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.json

  e2e:
    name: Playwright smoke (mock backend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: flowpanel
          POSTGRES_USER: flowpanel
          POSTGRES_PASSWORD: flowpanel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowpanel" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Start backend (mock AI profile)
        env:
          AI_PROFILE: mock
          DATABASE_URL: jdbc:postgresql://localhost:5432/flowpanel
          JWT_SECRET: ci-only-jwt-secret-0123456789-abcdefghijklmnop
        run: |
          nohup java -jar backend/target/flowpanel-backend.jar --spring.profiles.active=ci > backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            backend.log
